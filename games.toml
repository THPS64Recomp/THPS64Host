# Per-game table for the Edge of Reality N64 ports of Neversoft's THPS games.
#
# Every number here is a *fact about the ROM* (offsets, addresses, sizes, names),
# not ROM content. Tools in decomp/common/ read this through thpsgame.py.
# To add a game, see decomp/common/README.md ("Adding a game").
#
# Terms:
#   boot segment   plaintext code at ROM [boot_rom, root_ptr) -> RDRAM boot_vram
#                  (IDO libultra + EoR's loader). IPL3 copies it.
#   boot BSS       [boot_end, main_vram): cleared by the entry stub.
#   root_ptr       ROM offset of the u32 "asset root" word (0xB0000000|rom offset);
#                  it is the first word after the boot segment. The chunk table
#                  follows at root_ptr+4.
#   main image     the ERZ-inflated game code, loaded at main_vram, one chunk
#                  per `stride` bytes.
#   *_text         executable ranges (vram), with RSP microcode carved out.
#   ucode          RSP microcode linked inside the CPU .text: skipped by
#                  disassembly/recomp, split out by splat as `textbin`.
#   [[game.sig_unit]] etc. are optional hints used by sigmatch.
#
# Versions. A row may say `inherits = "<row>"` and list only what differs (thpsgame.py
# merges the chain). Rows of one family are ROM versions of one game (thps1, thps1_eu,
# thps1_us10...). Fields the THPS1 host reads (docs/internals/versions.md):
#   game_id, display_name   the host's GameEntry identity (header_name is the ROM header's internal name)
#   rom_md5, rom_xxh3       other hashes of the big-endian ROM (xxh3 = what librecomp's select_rom checks)
#   code_class              which recompiled payload runs this ROM; versions with identical code share one
#                           (decomp/thps<N>/recomp-host/versions/classes.toml)
#   tv_default              osTvType the host sets: "ntsc" | "pal" | "mpal" (a --tv flag overrides it)
#   status                  "supported" (host registers it) | "recognised" (identified by name, not run yet)
#   refs_from               test references fall through to this row's (tests/run.py --version)
#   rom_names               the dump's usual file names (tests find a ROM in roms/ by them)

[thps1]
title        = "Tony Hawk's Pro Skater (U) v1.1"
rom_sha1     = "4900b6c92fb8df1765e91e891dccc525bb102fe1"
rom_md5      = "aff424a1883dc7bb92c7b2ebe9342f85"
rom_xxh3     = "B7B085A35E270C23"
game_id      = "thps1.n64.us.1.1"
display_name = "Tony Hawk's Pro Skater (USA, v1.1)"
code_class   = "us11"
tv_default   = "ntsc"
status       = "supported"
rom_names    = ["Tony Hawk's Pro Skater (U) (v1.1).n64", "Tony Hawk's Pro Skater (USA) (Rev 1).z64"]
rom_size     = 0xC00000
header_name  = "TONY HAWK PRO SKATER"
game_code    = "NTFE"
revision     = 1
boot_rom     = 0x1000
boot_vram    = 0x80000400
boot_end     = 0x80012F10      # boot segment end == boot BSS start
main_vram    = 0x80016AC0      # boot BSS end == main image load address
root_ptr     = 0x13B10         # ROM offset of the asset-root word == boot segment end
stride       = 0x10000
code_method  = 1
n_chunks     = 14
main_size    = 0xDF9A0
main_sha1    = "7725fd5d2420769446ef81e207fddd398948781f"
game_bss_end = 0x800FC8D0      # boot main clears up to 0x800FC8C5; splat bss_size rounds up
entry        = 0x800C0480      # GameEntry
asset_root   = 0x61E26
n_packs      = 7
boot_text    = [[0x80000400, 0x80000468], [0x80000870, 0x80011C10]]
main_text    = [[0x800223C0, 0x80097C40], [0x8009B0A0, 0x800C0E20]]
boot_data_vram = 0x80011C10    # boot .data start (after the last jr ra + padding to 16)
main_data_vram = 0x800C0E20    # main .data start (same rule)
ucode        = [
  { name = "n_aspMain",   vram = 0x80097C40, size = 0xC60 },
  { name = "rspboot",     vram = 0x800988A0, size = 0xD0 },
  { name = "f3dex_fifo",  vram = 0x80098970, size = 0x1390 },
  { name = "f3dex_xbus",  vram = 0x80099D00, size = 0x13A0 },
]
cop2_note    = "3x mfc2 in func_8005D0B0 (called) + 3x ctc2 in func_8006F574 (uncalled)"
# ERZ recompression: asset pieces that cannot be repacked (name = pack index -> reason)
pack_quirks  = []

