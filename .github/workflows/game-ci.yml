# The CI of every game repository, kept once, here in THPS64Host (a reusable workflow). A game's .github/workflows/ci.yml only calls it,
# pinned to the same host tag as its decomp/common submodule:
#     uses: THPS64Recomp/THPS64Host/.github/workflows/game-ci.yml@vX.Y.Z    with: game: thpsN, host-tag: vX.Y.Z
# So a CI fix lands once, in the host, and reaches each game through the normal host bump (playbook scenario C).
# The game's profile is built against the pinned host. No ROM, no secrets beyond the optional read token, nothing ROM-derived.
#   host-pin  decomp/common is an official THPS64Host release: canonical URL, an annotated vX.Y.Z tag on the canonical repository, the
#             same tag this workflow is pinned to (.github/scripts/check_host_pin.sh, run from THIS host tag, not from the submodule)
#   patches   the pinned RT64 + our patches apply (git apply on a clean checkout of the pin)
#   versions  the version/code-class tables validate (tools/gen_versions.py check) and the header is deterministic
#   linux     the host builds with stub RecompiledFuncs (-DTHPS_STUB_FUNCS=ON), then the ROM-free checks run
#             (--features, --check-rom on an empty file, controls.cfg test)
#   windows   the same with clang-cl
#   macos     the same on arm64, the release target
# What this cannot prove: rendering (hosted runners have no GPU; RT64 skips software D3D12 adapters), audio, input.
# That needs a real Windows/Linux machine: decomp/<game>/recomp-host/docs/WINDOWS-TEST.md.
#
# Private repositories (the launch rehearsal only): the THPS64_READ_TOKEN secret, when the caller passes it, reads the private host and
# its tags. It is used only for trusted runs (pushes, manual runs and pull requests from branches of the same repository); a pull
# request from a fork gets the default token (and GitHub gives fork runs no secrets anyway). Public repositories need no token.
name: game-ci

on:
  workflow_call:
    inputs:
      game:
        description: "The game's family: thps1, thps2 or thps3"
        required: true
        type: string
      host-tag:
        description: "The THPS64Host tag this workflow is called at (the @vX.Y.Z of the uses: line); decomp/common must be at it"
        required: true
        type: string
    secrets:
      THPS64_READ_TOKEN:
        description: "Optional, private phase only: fine-grained token with read access to the four repositories' contents"
        required: false

permissions:
  contents: read

env:
  GAME: ${{ inputs.game }}
  HOST_TAG: ${{ inputs.host-tag }}
  SHARED: decomp/common/host

jobs:
  host-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The inputs from the game's ci.yml
        run: |
          echo "$GAME" | grep -Eqx 'thps[123]' || { echo "::error title=Bad game input::game is '$GAME'; .github/workflows/ci.yml must pass game: thps1, thps2 or thps3."; exit 1; }
          echo "$HOST_TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error title=Bad host-tag input::host-tag is '$HOST_TAG'; it must be the vX.Y.Z of the 'uses: ...game-ci.yml@vX.Y.Z' line."; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: THPS64Host at the tag this workflow is pinned to (its scripts check the submodule)
        uses: actions/checkout@v4
        with:
          repository: THPS64Recomp/THPS64Host
          ref: ${{ inputs.host-tag }}
          path: _thps64host
          persist-credentials: false
          token: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.THPS64_READ_TOKEN || github.token }}
      - name: decomp/common is an official THPS64Host release
        env:
          THPS64_HOST_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.THPS64_READ_TOKEN || github.token }}
        run: sh _thps64host/.github/scripts/check_host_pin.sh --expect-tag "$HOST_TAG"

  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          token: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.THPS64_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the pinned RT64 (patched files only) and apply our patches in order
        run: python -I "$SHARED/tools/setup_runtime.py" "$RUNNER_TEMP/rt" --patches-only

  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          token: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.THPS64_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version tables (games.toml, classes.toml, host_syms.toml, per-class data, game.toml)
        run: |
          H=decomp/$GAME/recomp-host
          python -I "$H/tools/gen_versions.py" check
          python -I "$H/tools/gen_versions.py" header "$RUNNER_TEMP/a.h"
          python -I "$H/tools/gen_versions.py" header "$RUNNER_TEMP/b.h"
          cmp "$RUNNER_TEMP/a.h" "$RUNNER_TEMP/b.h" || { echo "::error title=Version header not deterministic::gen_versions.py wrote two different headers from the same tables. Run it twice locally and diff the results."; exit 1; }

  build:
    needs: [host-pin, patches, versions]
    name: ${{ matrix.os }} (${{ inputs.game }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux clang
            runner: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: windows clang-cl
            runner: windows-latest
            cc: clang-cl
            cxx: clang-cl
          - os: macos arm64
            runner: macos-14
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          token: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.THPS64_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libsdl2-dev libvulkan-dev libx11-dev libgtk-3-dev
      - name: Dependencies (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - name: Pinned runtime + our RT64 patches
        run: python -I "$SHARED/tools/setup_runtime.py" "$RUNNER_TEMP/rt"
      - name: Build the game with stub functions, then the ROM-free checks
        env:
          CC_: ${{ matrix.cc }}
          CXX_: ${{ matrix.cxx }}
        run: |
          H=decomp/$GAME/recomp-host
          cmake -S "$H" -B "$RUNNER_TEMP/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DRECOMP_RUNTIME_DIR="$RUNNER_TEMP/rt" \
            -DTHPS_STUB_FUNCS=ON -DCMAKE_C_COMPILER="$CC_" -DCMAKE_CXX_COMPILER="$CXX_"
          cmake --build "$RUNNER_TEMP/build" --target "${GAME}_recomp"
          EXE="$RUNNER_TEMP/build/${GAME}_recomp"
          if [ -f "$EXE.exe" ]; then EXE="$EXE.exe"; fi
          "$EXE" --features
          : > "$RUNNER_TEMP/empty.rom"
          set +e; "$EXE" --config "$RUNNER_TEMP/cfg" --check-rom "$RUNNER_TEMP/empty.rom"; rc=$?; set -e
          echo "$GAME: check-rom of an empty file exited $rc (3 expected)"
          [ "$rc" = 3 ] || { echo "::error title=check-rom exit code::--check-rom on an empty file exited $rc, expected 3 (not a ROM). See the ROM checks in the host's src/ and run the same command locally."; exit 1; }
          python -I "$H/tests/controls_cfg_test.py" "$EXE"
          if [ "$RUNNER_OS" = Windows ]; then ls "$RUNNER_TEMP/build/"*.dll; fi
